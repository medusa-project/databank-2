:local_buckets:
  - databank-local-main
  - medusa-local-main
  - globus-local-download
:storage:
  - :name: draft
    :type: s3
    :endpoint: <%= ENV.fetch("STORAGE_S3_ENDPOINT", "http://minio:9000") %>
    :aws_access_key_id: <%= ENV.fetch("STORAGE_S3_ACCESS_KEY_ID", "minioadmin") %>
    :aws_secret_access_key: <%= ENV.fetch("STORAGE_S3_SECRET_ACCESS_KEY", "minioadmin") %>
    :force_path_style: true
    :region: <%= ENV.fetch("STORAGE_S3_REGION", "us-east-2") %>
    :bucket: <%= ENV.fetch("STORAGE_DRAFT_BUCKET", "databank-local-main") %>
    :prefix: <%= ENV.fetch("STORAGE_DRAFT_PREFIX", "uploads/") %>
  - :name: medusa
    :type: s3
    :endpoint: <%= ENV.fetch("STORAGE_S3_ENDPOINT", "http://minio:9000") %>
    :aws_access_key_id: <%= ENV.fetch("STORAGE_S3_ACCESS_KEY_ID", "minioadmin") %>
    :aws_secret_access_key: <%= ENV.fetch("STORAGE_S3_SECRET_ACCESS_KEY", "minioadmin") %>
    :force_path_style: true
    :region: <%= ENV.fetch("STORAGE_S3_REGION", "us-east-2") %>
    :bucket: <%= ENV.fetch("STORAGE_MEDUSA_BUCKET", "medusa-local-main") %>
    :prefix: <%= ENV.fetch("STORAGE_MEDUSA_PREFIX", "") %>
  - :name: globus_download
    :type: s3
    :endpoint: <%= ENV.fetch("STORAGE_S3_ENDPOINT", "http://minio:9000") %>
    :aws_access_key_id: <%= ENV.fetch("STORAGE_S3_ACCESS_KEY_ID", "minioadmin") %>
    :aws_secret_access_key: <%= ENV.fetch("STORAGE_S3_SECRET_ACCESS_KEY", "minioadmin") %>
    :force_path_style: true
    :region: <%= ENV.fetch("STORAGE_S3_REGION", "us-east-2") %>
    :bucket: <%= ENV.fetch("STORAGE_GLOBUS_BUCKET", "globus-local-download") %>
    :prefix: <%= ENV.fetch("STORAGE_GLOBUS_DOWNLOAD_PREFIX", "download/") %>
  - :name: globus_ingest
    :type: s3
    :endpoint: <%= ENV.fetch("STORAGE_S3_ENDPOINT", "http://minio:9000") %>
    :aws_access_key_id: <%= ENV.fetch("STORAGE_S3_ACCESS_KEY_ID", "minioadmin") %>
    :aws_secret_access_key: <%= ENV.fetch("STORAGE_S3_SECRET_ACCESS_KEY", "minioadmin") %>
    :force_path_style: true
    :region: <%= ENV.fetch("STORAGE_S3_REGION", "us-east-2") %>
    :bucket: <%= ENV.fetch("STORAGE_DRAFT_BUCKET", "databank-local-main") %>
    :prefix: <%= ENV.fetch("STORAGE_DRAFT_PREFIX", "uploads/") %>
  - :name: message
    :type: s3
    :endpoint: <%= ENV.fetch("STORAGE_S3_ENDPOINT", "http://minio:9000") %>
    :aws_access_key_id: <%= ENV.fetch("STORAGE_S3_ACCESS_KEY_ID", "minioadmin") %>
    :aws_secret_access_key: <%= ENV.fetch("STORAGE_S3_SECRET_ACCESS_KEY", "minioadmin") %>
    :force_path_style: true
    :region: <%= ENV.fetch("STORAGE_S3_REGION", "us-east-2") %>
    :bucket: <%= ENV.fetch("STORAGE_DRAFT_BUCKET", "databank-local-main") %>
    :prefix: "messages/"
  - :name: reports
    :type: s3
    :endpoint: <%= ENV.fetch("STORAGE_S3_ENDPOINT", "http://minio:9000") %>
    :aws_access_key_id: <%= ENV.fetch("STORAGE_S3_ACCESS_KEY_ID", "minioadmin") %>
    :aws_secret_access_key: <%= ENV.fetch("STORAGE_S3_SECRET_ACCESS_KEY", "minioadmin") %>
    :force_path_style: true
    :region: <%= ENV.fetch("STORAGE_S3_REGION", "us-east-2") %>
    :bucket: <%= ENV.fetch("STORAGE_DRAFT_BUCKET", "databank-local-main") %>
    :prefix: "reports/"
  - :name: tmpfs
    :type: filesystem
    :path: <%= ENV.fetch("STORAGE_TMPFS_PATH", "/tmp") %>
